[project]
name = "go-tech-feedback-ai"
version = "0.1.0"
description = "Product feedback RAG service for the GO-TECH monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncmy>=0.2.10",
  "fastapi>=0.116.0",
  "openai>=1.68.0",
  "pgvector>=0.3.6",
  "psycopg[binary,pool]>=3.2.6",
  "pydantic-settings>=2.8.1",
  "uvicorn[standard]>=0.34.0"
]

[project.scripts]
feedback-ai = "feedback_ai.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_ai"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=feedback_ai --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncmy", "asyncmy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

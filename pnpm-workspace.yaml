packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver

# ── Shared version catalog ─────────────────────────────────────────────────────
# In package.json, reference via:
#   "dep": "catalog:"           → default catalog
#   "dep": "catalog:react18"    → named catalog
#
# Packages with incompatible major versions across apps are kept explicit
# (tailwind-merge ^2 vs ^3, sonner ^1 vs ^2, tailwindcss ^3 vs ^4,
#  vite ^5 vs ^7, globals ^15 vs ^16, eslint-plugin-react-hooks ^5 vs ^7).

catalog:
  # ── Runtime — all 4 apps ────────────────────────────────────────────────────
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  lucide-react: "^0.562.0"
  tailwindcss-animate: "^1.0.7"
  zod: "^3.25.76"

  # ── Runtime — web-h5 + web-admin ────────────────────────────────────────────
  ahooks: "^3.9.6"

  # ── Runtime — web-admin + hr-pc + hr-mobile ─────────────────────────────────
  "@hookform/resolvers": "^3.10.0"
  "@tanstack/react-query": "^5.83.0"
  cmdk: "^1.1.1"
  date-fns: "^3.6.0"
  embla-carousel-react: "^8.6.0"
  input-otp: "^1.4.2"
  react-hook-form: "^7.61.1"
  react-resizable-panels: "^2.1.9"
  react-router-dom: "^6.30.1"
  recharts: "^2.15.4"
  sonner: "^1.7.4"
  tailwind-merge: "^2.6.0"

  # ── Runtime — hr-pc + hr-mobile (Radix UI) ──────────────────────────────────
  "@radix-ui/react-accordion": "^1.2.11"
  "@radix-ui/react-alert-dialog": "^1.1.14"
  "@radix-ui/react-aspect-ratio": "^1.1.7"
  "@radix-ui/react-avatar": "^1.1.10"
  "@radix-ui/react-checkbox": "^1.3.2"
  "@radix-ui/react-collapsible": "^1.1.11"
  "@radix-ui/react-context-menu": "^2.2.15"
  "@radix-ui/react-dialog": "^1.1.14"
  "@radix-ui/react-dropdown-menu": "^2.1.15"
  "@radix-ui/react-hover-card": "^1.1.14"
  "@radix-ui/react-label": "^2.1.7"
  "@radix-ui/react-menubar": "^1.1.15"
  "@radix-ui/react-navigation-menu": "^1.2.13"
  "@radix-ui/react-popover": "^1.1.14"
  "@radix-ui/react-progress": "^1.1.7"
  "@radix-ui/react-radio-group": "^1.3.7"
  "@radix-ui/react-scroll-area": "^1.2.9"
  "@radix-ui/react-select": "^2.2.5"
  "@radix-ui/react-separator": "^1.1.7"
  "@radix-ui/react-slider": "^1.3.5"
  "@radix-ui/react-slot": "^1.2.3"
  "@radix-ui/react-switch": "^1.2.5"
  "@radix-ui/react-tabs": "^1.1.12"
  "@radix-ui/react-toast": "^1.2.14"
  "@radix-ui/react-toggle": "^1.1.9"
  "@radix-ui/react-toggle-group": "^1.1.10"
  "@radix-ui/react-tooltip": "^1.2.7"

  # ── Dev — all 4 apps ────────────────────────────────────────────────────────
  eslint: "^9.32.0"
  typescript: "6.0.3"

  # ── Dev — web-h5 + web-admin ────────────────────────────────────────────────
  "@tailwindcss/postcss": "^4.1.18"
  babel-plugin-react-compiler: "1.0.0"

  # ── Dev — web-admin + hr-pc + hr-mobile ─────────────────────────────────────
  "@eslint/js": "^9.32.0"
  "@tailwindcss/typography": "^0.5.16"
  autoprefixer: "^10.4.21"
  eslint-plugin-react-refresh: "^0.4.20"
  postcss: "^8.5.6"
  typescript-eslint: "^8.61.1"

catalogs:
  # React 19 stack — web-h5 + web-admin
  react19:
    react: "^19.2.0"
    react-dom: "^19.2.0"
    "@types/react": "^19.2.5"
    "@types/react-dom": "^19.2.3"

  # React 18 stack — hr-pc-manager + hr_mobile_manager
  react18:
    react: "^18.3.1"
    react-dom: "^18.3.1"
    "@types/react": "^18.3.23"
    "@types/react-dom": "^18.3.7"

  # Vite 5 toolchain — hr-pc-manager + hr_mobile_manager
  # (web-admin uses Vite 7 + different eslint-plugin-react-hooks major)
  vite-hr:
    "@vitejs/plugin-react-swc": "^3.11.0"
    eslint-plugin-react-hooks: "^5.2.0"
    globals: "^15.15.0"
    jsdom: "^20.0.3"
    vite: "^5.4.19"

